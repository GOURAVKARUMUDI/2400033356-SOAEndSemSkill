spring.application.name=banking-token-auth
server.port=8080
spring.datasource.url=jdbc:h2:mem:banking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.jwt.issuer=banking-token-auth
app.jwt.ttl-minutes=15
# Required: export APP_JWT_SECRET_BASE64="$(openssl rand -base64 32)"
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}
